name = "hicm-space"
compatibility_date = "2024-03-20"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "hicm-space-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hicm-space-storage"

[[queues.producers]]
binding = "THESIS_QUEUE"
queue = "hicm-space-thesis-queue"

[[queues.consumers]]
queue = "hicm-space-thesis-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
